<style>
  :root { color-scheme: light; --ink:#2B1B22; --blush:#FFF3F6; --pink:#F6C9D6; --rose:#B3264F; --red:#D7263D; --muted:#6E5A63; --line:#F3D7DF; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fff; }
  body { display: grid; place-items: center; padding: 1.5rem; color: var(--ink);
         font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: min(24rem, 100%); background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--red);
          border-radius: 16px; padding: 2rem; box-shadow: 0 12px 40px rgba(179,38,79,.08); }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; color: var(--rose); font-size: 1.8rem; margin: 0 0 .4rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.5; }
  label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .4rem; }
  input { width: 100%; font: inherit; padding: .75rem .9rem; border: 1.5px solid var(--pink); border-radius: 10px; background: var(--blush); color: var(--ink); }
  input:focus { outline: 3px solid var(--pink); border-color: var(--red); }
  button { width: 100%; margin-top: 1rem; font: inherit; font-weight: 600; padding: .8rem; border: 0; border-radius: 10px;
           background: var(--red); color: #fff; cursor: pointer; }
  button:hover { background: var(--rose); }
  button:disabled { opacity: .7; cursor: wait; }
  .err { min-height: 1.4rem; margin-top: .8rem; color: var(--red); font-size: .92rem; }
</style>
</head>

  function fromB64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  document.getElementById("gate").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = document.getElementById("go"), err = document.getElementById("err");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking…";
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromB64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },

      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.iv) }, key, fromB64(DATA.ct));
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = "That password isn't right. Check it and try again.";
      btn.disabled = false; btn.textContent = "View site";
      document.getElementById("pw").select();
